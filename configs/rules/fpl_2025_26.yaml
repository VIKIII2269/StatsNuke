# FPL scoring rules, 2025/26 (first season with defensive contributions).
#
# Verification: the golden suite (tests/golden, `fplh golden check --season 2025/26`)
# reproduces official total_points for all 29,747 de-duplicated player-fixture rows of
# the season (vaastav merged_gw.csv) with these values, with zero mismatches.
# goal.GK is NOT identified by that data (no goalkeeper scored in 2025/26); its value is
# taken from the official rules page and must be re-checked if a GK goal ever mismatches.
season: "2025/26"
appearance:        {lt_60: 1, gte_60: 2}
goal:              {GK: 10, DEF: 6, MID: 5, FWD: 4}
assist:            3
clean_sheet:       {GK: 4, DEF: 4, MID: 1, FWD: 0, min_minutes: 60}
goals_conceded:    {GK: {per: 2, points: -1}, DEF: {per: 2, points: -1}}   # only while on pitch
saves:             {per: 3, points: 1}
penalty_save:      5
penalty_miss:      -2
yellow_card:       -1
red_card:          -3
own_goal:          -2
defensive_contribution:
  DEF:     {actions: [clearance, block, interception, tackle], threshold: 10, points: 2}
  MID_FWD: {actions: [clearance, block, interception, tackle, recovery], threshold: 12, points: 2}
  cap_per_match: 2
bonus:             {ranks: [3, 2, 1], tie_rule: official}
# Bonus Points System weights for the events the simulator generates (M10). Official
# base table; `fplh rules check-bps` compares it with weights estimated from the data.
bps:
  minutes_lt_60: 3               # 1-59 minutes; the 6 applies from exactly 60 (data)
  minutes_gte_60: 6
  goal: {GK: 12, DEF: 12, MID: 18, FWD: 24}
  assist: 9
  clean_sheet: {GK: 12, DEF: 12}
  goal_conceded: {GK: -4, DEF: -4}
  save: 2
  penalty_save: 8               # identified from data: +9.3 (2024/25), +7.8 (2025/26) BPS vs comparable GK matches; was 15
  penalty_miss: -6
  yellow_card: -3
  red_card: -9
  own_goal: -6
game:
  squad: {GK: 2, DEF: 5, MID: 5, FWD: 3}
  xi_min: {GK: 1, DEF: 3, MID: 2, FWD: 1}
  max_per_club: 3
  free_transfer_bank_max: 5
  hit_cost: 4
  free_transfers_preserved_on: [wildcard, free_hit]
  chips: {sets: 2, per_set: [wildcard, free_hit, triple_captain, bench_boost], first_set_deadline_gw: 19}   # two sets; the first by the GW19 deadline
  special_free_transfers: {16: 5}    # AFCON: free transfers topped up to five in GW16
  lockdown: "D+1 09:00 Europe/London"
