# FPL scoring rules, 2019/20.
#
# Scoring verified by `fplh golden check-silver --season 2019-20` against every official
# total_points row of the season (see docs/IMPLEMENTATION_PLAN.md). goal.GK = 6 is
# identified by data (Alisson, 2020/21). No defensive-contribution points before 2025/26.
# The `game` block is approximate for this season (see the chip comments); Phase 4 replays
# use 2022/23 onwards only.
season: "2019/20"
appearance:        {lt_60: 1, gte_60: 2}
goal:              {GK: 6, DEF: 6, MID: 5, FWD: 4}
assist:            3
clean_sheet:       {GK: 4, DEF: 4, MID: 1, FWD: 0, min_minutes: 60}
goals_conceded:    {GK: {per: 2, points: -1}, DEF: {per: 2, points: -1}}   # only while on pitch
saves:             {per: 3, points: 1}
penalty_save:      5
penalty_miss:      -2
yellow_card:       -1
red_card:          -3
own_goal:          -2
defensive_contribution:  # not scored before 2025/26
  DEF:     {actions: [clearance, block, interception, tackle], threshold: 10, points: 0}
  MID_FWD: {actions: [clearance, block, interception, tackle, recovery], threshold: 12, points: 0}
  cap_per_match: 0
bonus:             {ranks: [3, 2, 1], tie_rule: official}
# Bonus Points System weights for the events the simulator generates (M10). Official
# base table; `fplh rules check-bps` compares it with weights estimated from the data.
bps:
  minutes_lt_60: 3               # 1-59 minutes; the 6 applies from exactly 60 (data)
  minutes_gte_60: 6
  goal: {GK: 12, DEF: 12, MID: 18, FWD: 24}
  assist: 9
  clean_sheet: {GK: 12, DEF: 12}
  goal_conceded: {GK: -4, DEF: -4}
  save: 2
  penalty_save: 15
  penalty_miss: -6
  yellow_card: -3
  red_card: -9
  own_goal: -6
game:
  squad: {GK: 2, DEF: 5, MID: 5, FWD: 3}
  xi_min: {GK: 1, DEF: 3, MID: 2, FWD: 1}
  max_per_club: 3
  free_transfer_bank_max: 2
  hit_cost: 4
  free_transfers_preserved_on: []
  chips:
    # one copy per window (inclusive gameweeks); approximate: first-wildcard cut-off not verified
    windows:
      wildcard: [[2, 19], [20, 38]]
      free_hit: [[2, 38]]
      triple_captain: [[1, 38]]
      bench_boost: [[1, 38]]
  lockdown: "D+1 09:00 Europe/London"
