# M1 team-strength hyper-parameters (models/team_strength.py).
# Fitted by `fplh models fit-m1 --before 2022-07-01 --restarts 2`, run as two chains:
# A warm-started from a single fit from the defaults, B from an earlier fit (best kept).
# One-step-ahead predictive log-likelihood of goals on 2014-15–2021-22 per match:
# B -2.89881 (A -2.89892; defaults -2.90762; at these parameters goals only, ω = 0,
# -2.90591 and without the E1 prior -2.90289). sigma_a sits at its lower bound and
# season_regress at 1: attack ratings barely drift and no summer regression is wanted.
version: 1
trained_on:
- 2014-15
- 2021-22
params:
  c0: 0.3
  eta: 0.19914
  phi_year: 0.999998
  sigma_a: 0.020321
  sigma_d: 0.100447
  sigma_c: 0.05
  omega: 0.120831
  kappa: 16.052119
  season_regress: 1.0
  season_var: 0.005342
  promoted_a: -0.618512
  promoted_d: -0.289443
  promoted_var: 0.03
  promoted_slope_a: 0.978997
  promoted_slope_d: 0.349025
  init_var: 0.1
