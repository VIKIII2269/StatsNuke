# Team identity. football-data.co.uk names (E0 and E1) are canonical: a team's uid is
# the slug of its football-data name (e.g. "Nott'm Forest" → nottm-forest).
# Other sources' names must either slugify to a known uid or be listed as aliases here.
# Unknown names fail the silver build with suggestions; add an alias, never guess.

# EPL clubs since 2014/15 (used as the known set when football-data isn't loaded).
