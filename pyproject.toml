[project]
name = "fplh"
version = "0.1.0"
description = "EPL × FPL hybrid forecasting system (see ARCHITECTURE.md)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "fsspec>=2024.6",
    "httpx>=0.27",
    "pandas>=2.2",
    "pandera>=0.33.1",
    "pyarrow>=16",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "rapidfuzz>=3.14.6",
    "tenacity>=8.3",
    "typer>=0.12",
]

[project.optional-dependencies]
s3 = ["s3fs>=2024.6"]
tracking = [
    "mlflow-skinny>=3.16.1",
]

[project.scripts]
fplh = "fplh.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fplh"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]
allowed-confusables = ["×", "−", "–", "ı", "’", "ℓ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT018"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fsspec.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "golden: full-season golden tests; need `fplh golden fetch` first (skipped if data is absent)",
    "network: hits live endpoints",
]
addopts = "-ra"
